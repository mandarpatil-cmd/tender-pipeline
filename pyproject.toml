[project]
name = "tender-pipeline"
version = "0.1.0"
description = "Find tender winners, look up contacts, and email them"
requires-python = ">=3.13"
dependencies = [
    "ops-ui",
    "pipeline-core[xlsx]",
]

[tool.uv.sources]
ops-ui = { workspace = true }
pipeline-core = { workspace = true }

[tool.uv.workspace]
members = ["core", "01-scrape", "02-enrich", "03-outreach", "ui"]

[dependency-groups]
dev = ["pytest>=9.1"]