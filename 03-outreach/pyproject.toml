[project]
name = "stage3-outreach"
version = "0.1.0"
description = "Mail the vendors the pipeline found an address for (stage 3)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "msal>=1.31",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # get_data.py writes the send queue to .xlsx
    "openpyxl>=3.1",
    # the shared schema: every stage installs this
    "pipeline-core",
]


[tool.uv]
package = false

[tool.uv.sources]
pipeline-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
