[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-ui"
version = "0.1.0"
description = "Local browser window for the tender pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "pipeline-core",
]

[project.scripts]
ops-ui = "ops_ui.app:main"

[tool.uv.sources]
pipeline-core = { path = "../core", editable = true }

# The whole pipeline shares one environment at the repo root (../requirements.txt).
# This keeps `uv run` / `uv sync` from building a separate .venv in this folder.
[tool.uv]
managed = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ops_ui = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
