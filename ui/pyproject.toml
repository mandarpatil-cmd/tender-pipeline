[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-ui"
version = "0.1.0"
description = "Local browser window for the tender pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "pipeline-core",
    "stage1-scrape",
    "stage2-enrich",
    "msal>=1.31",
]

[project.scripts]
ops-ui = "ops_ui.app:main"

[tool.uv.sources]
pipeline-core = { workspace = true }
stage1-scrape = { workspace = true }
stage2-enrich = { workspace = true }


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ops_ui = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
