<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tender pipeline{% endblock %}</title>
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=13">
  <script src="/static/htmx.min.js"></script>
</head>
<body data-back="{% block back_fallback %}{% endblock %}">
  {% set here = request.url.path %}
  <header class="top sticky">
    <a class="back-app" id="back" hidden href="/">← Back</a>
    <a class="brand" href="/">Tender pipeline</a>
    <nav class="nav">
      <a href="{{ nav_href('home', request.cookies.get('home_query', '')) }}" {% if here == '/' %}class="current" aria-current="page"{% endif %}>All tenders</a>
      <a href="{{ nav_href('scrape', '') }}" {% if here.startswith('/scrape') or here.startswith('/tender') %}class="current" aria-current="page"{% endif %}>New tenders</a>
      <a href="{{ nav_href('enrich', request.cookies.get('enrich_query', '')) }}" {% if here.startswith('/enrich') or here == '/selection' %}class="current" aria-current="page"{% endif %}>Get contacts</a>
      <a href="{{ nav_href('mail', request.cookies.get('mail_query', '')) }}" {% if here.startswith('/mail') %}class="current" aria-current="page"{% endif %}>Send email</a>
      <a href="/jobs" {% if here.startswith('/jobs') %}class="current" aria-current="page"{% endif %}>Activity</a>
    </nav>
    <button type="button" class="quiet theme" id="theme" aria-label="Switch to dark mode">🌙</button>
  </header>
  <main class="{% block main_class %}narrow{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <script>
    (function () {
      var button = document.getElementById("theme");
      function label() {
        var dark = document.documentElement.classList.contains("dark");
        button.textContent = dark ? "☀️" : "🌙";
        button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      }
      label();
      button.addEventListener("click", function () {
        var dark = document.documentElement.classList.toggle("dark");
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
        label();
      });
    })();
  </script>
  <script>
    (function () {
      var key = "nav_stack";
      function read() {
        try { return JSON.parse(sessionStorage.getItem(key) || "[]"); }
        catch (e) { return []; }
      }
      function write(stack) {
        try { sessionStorage.setItem(key, JSON.stringify(stack.slice(-20))); }
        catch (e) {}
      }
      function here() { return location.pathname + location.search; }
      function show(stack) {
        var link = document.getElementById("back");
        if (!link) return;
        var prev = stack.length > 1 ? stack[stack.length - 2] : "";
        if (!prev) prev = document.body.getAttribute("data-back") || "";
        if (!prev || prev === here()) {
          link.hidden = true;
          return;
        }
        link.hidden = false;
        link.setAttribute("href", prev);
      }
      function remember() {
        var stack = read();
        var url = here();
        var at = stack.lastIndexOf(url);
        if (at >= 0) stack = stack.slice(0, at + 1);
        else stack.push(url);
        write(stack);
        show(stack);
      }
      remember();
      document.body.addEventListener("htmx:pushedIntoHistory", remember);
    })();
  </script>
  <script>
    function shiftDays(isoDay, days) {
      var parts = isoDay.split("-");
      if (parts.length !== 3) return "";
      var day = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(day.getTime())) return "";
      day.setDate(day.getDate() - days);
      var month = String(day.getMonth() + 1).padStart(2, "0");
      var date = String(day.getDate()).padStart(2, "0");
      return day.getFullYear() + "-" + month + "-" + date;
    }
    function syncDateRange(group, source) {
      var preset = group.querySelector("[data-role=preset]");
      var from = group.querySelector("[data-role=from]");
      var toMode = group.querySelector("[data-role=to-mode]");
      var to = group.querySelector("[data-role=to]");
      if (!preset || !from || !to) return;
      if (source && source.getAttribute("data-role") === "from") preset.value = "";
      var mode = preset.value;
      var specific = mode === "";
      from.disabled = !specific;
      from.hidden = !specific;
      if (toMode) {
        if (mode !== "any" && mode !== "" && toMode.value === "any") {
          toMode.value = "";
          if (!to.value) to.value = group.getAttribute("data-today") || "";
        }
        var toAny = toMode.value === "any";
        to.disabled = toAny;
        to.hidden = toAny;
        if (!toAny && !to.value) to.value = group.getAttribute("data-today") || "";
      }
      if (specific || mode === "any") return;
      var end = to.value || group.getAttribute("data-today") || "";
      if (!end) return;
      if (!to.value) to.value = end;
      from.value = shiftDays(end, Number(mode));
    }
    function bindDateRanges(root) {
      (root || document).querySelectorAll("[data-date-range]").forEach(function (group) {
        syncDateRange(group, null);
      });
    }
    document.addEventListener("change", function (event) {
      var el = event.target;
      if (!el.closest) return;
      var group = el.closest("[data-date-range]");
      if (!group || !el.getAttribute || !el.getAttribute("data-role")) return;
      group.setAttribute("data-touched", "1");
      syncDateRange(group, el);
    });
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!form.querySelectorAll) return;
      form.querySelectorAll("[data-date-range][data-suggested='1']").forEach(function (group) {
        if (group.getAttribute("data-touched") === "1") return;
        group.querySelectorAll("input, select").forEach(function (el) {
          el.value = "";
        });
      });
    }, true);
    bindDateRanges(document);
    document.addEventListener("htmx:afterSwap", function (event) {
      bindDateRanges(event.target);
    });
  </script>
</body>
</html>
