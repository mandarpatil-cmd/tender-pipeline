<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run {{ job.job_id }}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --ink: #f3ecdf; --muted: #a89880; --line: #3c3428; --desk: #12100e; --card: #1c1915; --amber: #e2a15a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: linear-gradient(180deg, #181510 0%, var(--desk) 40%);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
    a, button { color: var(--amber); }
    h1 { font-weight: 500; margin: 0.3rem 0; }
    .kicker, .meta, pre, button { font-family: Consolas, ui-monospace, monospace; }
    .kicker { letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.72rem; color: var(--amber); }
    .warn { color: var(--amber); }
    pre {
      white-space: pre-wrap;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1rem;
      min-height: 8rem;
    }
    button { background: var(--desk); border: 1px solid var(--line); padding: 0.45rem 0.7rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">{{ job.stage }}</p>
    <p><a href="/jobs">All runs</a></p>
    <h1>Run {{ job.job_id }}</h1>
    {% if refused %}<p class="warn">A new run was refused. This one is still going.</p>{% endif %}
    {% include "job_live.html" %}
  </main>
</body>
</html>
