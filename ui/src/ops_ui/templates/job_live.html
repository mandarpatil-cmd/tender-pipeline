<div id="live" {% if job.state == 'running' %}hx-get="/jobs/{{ job.job_id }}/live" hx-trigger="every 1s" hx-swap="outerHTML"{% endif %}>
  <p class="meta">{{ job.state }}{% if job.finished_at %} · {{ job.finished_at }}{% endif %}</p>
  {% if job.state == 'running' %}
  <form method="post" action="/jobs/{{ job.job_id }}/stop">
    <button type="submit">Stop</button>
  </form>
  {% endif %}
  <pre>{{ job.log }}</pre>
</div>
